spring.jpa.show-sql=true
logging.level.com.atomikos=DEBUG
spring.jta.atomikos.datasource.localTransactionMode=true

spring.jta.atomikos.properties.threadedTwoPhaseCommit=true
spring.jta.atomikos.properties.serialJtaTransactions=false

spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_HOLD

# DELAYED_ACQUISITION_AND_RELEASE_BEFORE_TRANSACTION_COMPLETION
# DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION